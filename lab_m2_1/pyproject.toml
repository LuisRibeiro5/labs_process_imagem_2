[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi-lab-m2-1"
version = "0.1.0"
description = "Laboratório M2.1 de Processamento de Imagens"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless==5.0.0.93", "numpy>=1.26.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
